services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Supabase PostgreSQL URI}
      CARBON_API_BASE_URL: ${CARBON_API_BASE_URL:-https://api.carbonintensity.org.uk}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-1800}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
